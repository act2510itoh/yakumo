<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>お問い合わせ|株式会社八雲ステージ</title>
		<meta
			name="description"
			content="株式会社八雲ステージへのお問い合わせページです。舞台大道具・イベント設営のご相談、お見積りのご依頼などを、フォームより受け付けています。" />
		<meta property="og:title" content="お問い合わせ|株式会社八雲ステージ" />
		<meta
			property="og:description"
			content="株式会社八雲ステージへのお問い合わせページです。舞台大道具・イベント設営のご相談、お見積りのご依頼などを、フォームより受け付けています。" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://act2510itoh.github.io/yakumo/contact.html" />
		<meta property="og:image" content="https://act2510itoh.github.io/yakumo/assets/images/yakumo_logo1.png" />
		<meta property="og:site_name" content="株式会社八雲ステージ" />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="icon" href="./assets/images/yakumo_favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=EB+Garamond:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="./assets/css/style.css" />
		<!-- JSが動く時だけ演出用の初期状態にする(表示前に付けてちらつきを防ぐ) -->
		<script>
			document.documentElement.classList.add('js');
		</script>
	</head>
	<body>
		<!-- ヘッダー -->
		<header class="l-header">
			<div class="l-header__inner">
				<h1 class="l-header__logo">
					<a href="./index.html">
						<img src="./assets/images/yakumo_logo1.png" alt="株式会社八雲ステージ" />
					</a>
				</h1>
				<nav class="l-nav" id="global-nav">
					<ul class="l-nav__list">
						<li class="l-nav__item">
							<a href="./index.html#about">ABOUT</a>
						</li>
						<li class="l-nav__item">
							<a href="./index.html#works">WORKS</a>
						</li>
						<li class="l-nav__item">
							<a href="./company.html">COMPANY</a>
						</li>
						<li class="l-nav__item">
							<a href="./recruit.html">RECRUIT</a>
						</li>
					</ul>
					<div class="l-btn c-btn c-btn--icon">
						<a href="./contact.html">
							<!-- メールのアイコン(飾りなので読み上げない) -->
							<svg
								class="c-btn__icon"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="1.4"
								aria-hidden="true">
								<rect x="3" y="5.5" width="18" height="13" rx="1" />
								<path d="M3.5 6.5l8.5 6.5 8.5-6.5" />
							</svg>
							お問い合わせ
						</a>
					</div>
				</nav>
				<button
					type="button"
					class="l-ham"
					aria-label="メニューを開く"
					aria-expanded="false"
					aria-controls="global-nav">
					<span></span>
					<span></span>
					<span></span>
				</button>
			</div>
		</header>
		<!-- パンくずリスト -->
		<nav class="c-breadcrumb c-container" aria-label="パンくずリスト">
			<ol>
				<li><a href="./index.html">TOP</a></li>
				<li aria-current="page">お問い合わせ</li>
			</ol>
		</nav>
		<!-- ここからコンテンツ -->
		<main class="p-contact c-section-block">
			<h2 class="c-section-title c-section-title__center">
				<span class="en">
					<img src="./assets/images/yakumo_contact.webp" alt="CONTACT" loading="lazy" />
				</span>
				<span class="jp">お問い合わせ</span>
			</h2>
			<div class="c-heading-text c-container">
				<p>この度は、弊社のホームページを<br class="sp" />ご覧いただき誠に有難うございます。</p>
				<p>お問い合わせ内容を確認後、<br class="sp" />１週間以内に弊社より返信をさせていただきます。</p>
			</div>

			<!-- お問い合わせフォームセクション -->
			<section class="c-container">
				<!-- 送信先:Formspreeで作ったフォームのURLに差し替える -->
				<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="js-contact-form" data-redirect="./contact-send.html">
					<!-- スパム対策(人には見えない欄。ボットが埋めたら送信しない) -->
					<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display: none" />
					<div class="c-form">
						<label for="name">お名前 <span class="required">必須</span></label>
						<input type="text" id="name" name="name" autocomplete="name" required placeholder="八雲　太郎" />
					</div>
					<div class="c-form">
						<label for="company">会社名 <span class="optional">任意</span></label>
						<input type="text" id="company" name="company" autocomplete="organization" placeholder="株式会社八雲ステージ" />
					</div>

					<div class="c-form">
						<label for="email">メールアドレス <span class="required">必須</span></label>
						<input type="email" id="email" name="email" autocomplete="email" required placeholder="yakumo@yakumo.jp" />
					</div>

					<div class="c-form">
						<label for="select-type">お問い合わせ項目<span class="required">必須</span></label>
						<select id="select-type" name="select-type" required>
							<option value="" disabled selected>以下の項目からお選び下さい</option>
							<option value="大道具スタッフ派遣について">大道具スタッフ派遣について</option>
							<option value="制作物について">制作物について</option>
							<option value="その他">その他</option>
						</select>
					</div>

					<div class="c-form">
						<label for="message">お問い合わせ内容 <span class="required">必須</span></label>
						<textarea id="message" name="message" rows="6" required></textarea>
					</div>

					<div class="c-form__checkbox">
						<input type="checkbox" id="agree" name="agree" required />
						<label for="agree"
							><a href="./privacy-policy.html" target="_blank" rel="noopener"><span>プライバシーポリシー</span>に同意する</a></label
						>
					</div>

					<p class="c-form__error" role="alert" hidden>送信に失敗しました。時間をおいて、もう一度お試しください。</p>

					<button type="submit" class="c-btn c-btn--submit">
						<span>
							<!-- 紙飛行機のアイコン(飾りなので読み上げない) -->
							<svg
								class="c-btn__icon"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="1.4"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true">
								<line x1="21" y1="3" x2="11" y2="13" />
								<polygon points="21 3 14 21 11 13 3 10 21 3" />
							</svg>
							送信する
						</span>
					</button>
				</form>
			</section>
		</main>
		<!-- フッター -->
		<footer class="l-footer">
			<div class="l-footer__inner c-container">
				<h3 class="l-footer__title">
					<a href="./index.html">
						<span class="l-footer__logo">
							<img src="./assets/images/yakumo_logo1.png" alt="株式会社八雲ステージ" loading="lazy" />
						</span>
						<span class="l-footer__text">株式会社八雲ステージ</span>
					</a>
				</h3>
				<p><a href="./privacy-policy.html">プライバシーポリシー</a></p>
			</div>
			<small>&copy; YAKUMO STAGE INC. ALL RIGHTS RESERVED.</small>
		</footer>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
		<script src="./assets/js/common.js"></script>
	</body>
</html>
